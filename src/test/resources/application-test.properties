# Test configuration
# Testcontainers provides datasource and redis connection values dynamically.
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false

# Flyway Configuration
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

# Security Configuration
jwt.secret=test-secret-key-for-testing-minimum-256-bits-long-for-security
jwt.expiration=86400000

# Admin Configuration
admin.registration.key=test-admin-registration-key


# Logging Configuration
logging.level.root=INFO
logging.level.org.william.cex=INFO
logging.level.org.springframework.test=WARN

