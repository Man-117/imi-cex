spring.application.name=cex

# Database Configuration
spring.datasource.url=jdbc:postgresql://localhost:5432/cex_db
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA/Hibernate Configuration
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.batch_size=20
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true

# Redis Configuration
spring.data.redis.host=localhost
spring.data.redis.port=6379
spring.data.redis.timeout=60000
spring.data.redis.jedis.pool.max-active=8
spring.data.redis.jedis.pool.max-idle=8

# Flyway Configuration
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

# Server Configuration
server.port=8080
server.servlet.context-path=/api

# Security Configuration
jwt.secret=${JWT_SECRET:change-this-jwt-secret-in-production-minimum-256-bits}
jwt.expiration=86400000

# Admin Configuration
admin.registration.key=${ADMIN_REGISTRATION_KEY:change-this-admin-registration-key}

# Risk guard rails (interview-demo defaults)
cex.risk.max-order-notional=${CEX_RISK_MAX_ORDER_NOTIONAL:500000}
cex.risk.max-daily-notional=${CEX_RISK_MAX_DAILY_NOTIONAL:2000000}


# Logging Configuration
logging.level.root=INFO
logging.level.org.william.cex=INFO
logging.level.org.william.cex.api.controller=INFO
logging.level.org.william.cex.domain.user.service=INFO
logging.level.org.william.cex.infrastructure.security=INFO
logging.level.org.springframework.security=INFO
logging.level.org.springframework.web=INFO
logging.level.org.springframework.web.servlet.mvc.method.annotation.RequestMappingHandlerMapping=INFO
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n
logging.file.name=/tmp/cex-app.log
logging.file.max-size=10MB
logging.file.max-history=10
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n

# Actuator Configuration
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=when-authorized

